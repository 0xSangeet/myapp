name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build image
        run: docker build -t x96dbg/myapp:latest .

      - name: Push image
        run: docker push x96dbg/myapp:latest

      - name: Deploy
        run: |
          docker pull x96dbg/myapp:latest
          docker compose up -d --force-recreate
